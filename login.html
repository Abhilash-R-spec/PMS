<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFJ Prayer Cells — Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <h1>SFJ <span>Prayer Cells</span></h1>
      <p>2026-2027 · Chennai</p>
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" class="input" type="text" required autocomplete="username" placeholder="admin" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" class="input" type="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign in</button>
      <p id="loginError" class="hint err-text"></p>
    </form>
  </div>
  <div id="toast" class="toast"></div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
