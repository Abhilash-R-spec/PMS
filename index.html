<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFJ Prayer Cells — Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>SFJ <span>Prayer Cells</span></h1>
        <p>2026-2027 · Chennai</p>
      </div>
      <ul id="navList" class="nav"></ul>
      <div class="sidebar-foot">
        <div id="userTag" class="user-tag"></div>
        <button id="btnUsers" class="btn btn-ghost admin-only" title="Manage user accounts">👥 Users</button>
        <button id="btnPw" class="btn btn-ghost" title="Change password">🔒 Password</button>
        <button id="btnLogout" class="btn btn-ghost" title="Sign out">⏻ Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <h2 id="pageTitle">…</h2>
        <div class="toolbar-right">
          <input id="search" class="input search" type="search" placeholder="Search…" />
          <button id="btnAdd" class="btn btn-primary">+ Add</button>
        </div>
      </header>

      <div class="count-bar">
        <span id="count"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr id="thead-row"></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modal" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">Add</h3>
        <button id="btnClose" class="btn btn-ghost">&times;</button>
      </div>
      <form id="form"></form>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" form="form">Save</button>
      </div>
    </div>
  </div>

  <div id="pwModal" class="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3>Change Password</h3>
        <button id="btnPwClose" class="btn btn-ghost">&times;</button>
      </div>
      <form id="pwForm" autocomplete="off">
        <div class="field">
          <label>Current Password</label>
          <input id="pwOld" type="password" class="input" required autocomplete="current-password" />
        </div>
        <div class="field">
          <label>New Password</label>
          <input id="pwNew" type="password" class="input" required minlength="6" autocomplete="new-password" />
        </div>
        <div class="field">
          <label>Confirm New Password</label>
          <input id="pwNew2" type="password" class="input" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary">Update Password</button>
      </form>
    </div>
  </div>

  <div id="usersModal" class="modal">
    <div class="modal-box users-box">
      <div class="modal-head">
        <h3>User Accounts</h3>
        <button id="btnUsersClose" class="btn btn-ghost">&times;</button>
      </div>

      <h4 class="users-sub">Add new user</h4>
      <form id="userAddForm" class="users-add" autocomplete="off">
        <input id="uaUsername" type="text" class="input" placeholder="Username" required />
        <input id="uaPassword" type="password" class="input" placeholder="Password" required minlength="6" />
        <select id="uaRole" class="input">
          <option value="shepherd">Shepherd</option>
          <option value="viewer">Viewer</option>
          <option value="admin">Admin</option>
        </select>
        <button type="submit" class="btn btn-primary">+ Add</button>
      </form>

      <h4 class="users-sub">Existing users</h4>
      <ul id="userList" class="user-list"></ul>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
